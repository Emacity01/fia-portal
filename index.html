<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FIA Allotment</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    font-family:'Orbitron', sans-serif;
    background:url('https://imgs.search.brave.com/um80_UHagsPGcFZTUsOcvkQVb3lccVveXoqJcJUEN28/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9kMm45/aDJ3aXRzMjNoZi5j/bG91ZGZyb250Lm5l/dC9pbWFnZS92MS9z/dGF0aWMvNjA1Nzk0/OTQzMjAwMS8xMWU3/NDdhNi01NTg2LTQ2/YTQtOGEyOS1jOTQw/ODhhZDkzYjgvNzZi/NGQ2Y2MtMjkxZS00/ZmJhLWFhNWYtYTVi/NGI2YjIwMWY2Lzg2/NHg0ODYvbWF0Y2gv/aW1hZ2UuanBn') center/cover no-repeat fixed;
    color:white;
    overflow:auto;
}
.overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.82);
}
body::after{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,0,0,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,0,0.08) 1px, transparent 1px);
    background-size:60px 60px;
    pointer-events:none;
}

/* Gate */
#gate{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.95);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    z-index:9999;
}
#gate input,#gate button{
    padding:12px; font-size:18px;
    border-radius:6px; border:none; margin:10px;
}
#gate button{ background:red; color:white; cursor:pointer; }

/* Tags */
#broadcastTag{
    position:absolute; top:20px; left:30px;
    background:rgba(0,0,0,0.75);
    border-left:6px solid red;
    padding:12px 18px; font-size:18px;
    letter-spacing:2px; box-shadow:0 0 20px red;
}
#clock{ position:absolute; top:20px; right:40px; font-size:22px; }

/* Start */
#startBtn{
    position:absolute; top:45%; left:50%;
    transform:translate(-50%,-50%);
    padding:18px 60px; font-size:22px;
    background:red; border:none; color:white;
    display:none; cursor:pointer;
}

/* Ready & Lights */
#ready{
    position:absolute; top:30%; width:100%;
    text-align:center; font-size:60px;
    display:none; animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0.2;}}
#lights{ position:absolute; top:42%; width:100%; text-align:center; display:none; }
.light{
    height:60px;width:60px;margin:20px;
    display:inline-block;border-radius:50%;
    background:#300;
}

/* Result */
#result{
    position:absolute; top:35%; left:50%;
    transform:translateX(-50%);
    width:60%; padding:40px;
    text-align:center; font-size:38px;
    display:none;
    background:rgba(0,0,0,0.65);
    border:2px solid red;
    box-shadow:0 0 40px red;
    backdrop-filter: blur(8px);
    border-radius:12px;
}
.munHeading{
    font-size:42px; margin-bottom:40px;
    text-shadow:0 0 25px red;
}

/* Ticker */
#ticker{
    position:absolute; bottom:0; width:100%;
    background:rgba(0,0,0,0.85);
    padding:12px; white-space:nowrap; overflow:hidden;
}
#ticker span{
    display:inline-block; padding-left:100%;
    animation:scroll 20s linear infinite;
}
@keyframes scroll{to{transform:translateX(-100%);}}
</style>
</head>

<body>
<div class="overlay"></div>

<div id="gate">
    <h1 style="color:red;">Enter FIA ID</h1>
    <input type="text" id="fiaInput" placeholder="FIA-001">
    <button onclick="checkID()">Enter</button>
</div>

<div id="broadcastTag">EMACITY MODEL UNITED NATIONS • FIA COMMITTEE</div>
<div id="clock"></div>
<button id="startBtn" onclick="startShow(this)">INITIATE FIA ALLOTMENT</button>

<div id="ready">ARE YOU READY?</div>
<div id="lights">
    <div class="light" id="l1"></div>
    <div class="light" id="l2"></div>
    <div class="light" id="l3"></div>
    <div class="light" id="l4"></div>
</div>

<div id="result">
    <div class="munHeading">EMACITY MODEL UNITED NATIONS<br>FIA COMMITTEE</div>
    <p>Delegate: <strong id="name"></strong></p>
    <p>Role: <strong id="port"></strong></p>
</div>

<div id="ticker">
<span>FIA News • DRS debate • Rain probability 60% • Track limits warning • Safety car protocol revision</span>
</div>

<audio id="startSound" src="f1sound.mp3"></audio>

<script>
const delegates = {
"FIA-001": { name:"Vallarry Kshipra Mangesh Deshmukh", portfolio:"George Russell" },
"FIA-002": { name:"Anomitra Das", portfolio:"Lewis Hamilton" },
"FIA-003": { name:"Adit Kulkarni", portfolio:"Toto Wolff" },
"FIA-004": { name:"Neil Pillai", portfolio:"Carlos Sainz" },
"FIA-005": { name:"Ritvik Duradundeshwara Hukkeri", portfolio:"Max Verstappen" },
"FIA-006": { name:"Aarav Mittal", portfolio:"Frédéric Vasseur" },
"FIA-007": { name:"Rishan Shaikh", portfolio:"Andrea Stella" },
"FIA-008": { name:"Kapish Jhawar", portfolio:"Charles Leclerc" },
"FIA-009": { name:"Vivaan Virat", portfolio:"Kimi Antonelli" },
"FIA-010": { name:"Vedant More", portfolio:"Oscar Piastri" },
"FIA-011": { name:"Ishika Arya", portfolio:"Lando Norris" },
"FIA-012": { name:"Nirvan Sharma", portfolio:"Isack Hadjar" },
"FIA-013": { name:"Mihika Mukherjee", portfolio:"James Vowles" },
"FIA-014": { name:"Aabha Rajesh Maynal", portfolio:"Lance Stroll" },
"FIA-015": { name:"Sanvi Santosh Kapare", portfolio:"Laurent Mekies" },
"FIA-016": { name:"Hansika Nege", portfolio:"Adrian Newey" },
"FIA-017": { name:"Nidhi Shinde", portfolio:"Fernando Alonso" },
"FIA-018": { name:"Avnish Kedia", portfolio:"Pierre Gasly" },
"FIA-019": { name:"Hardik Bhalgat", portfolio:"Flavio Briatore" },
"FIA-020": { name:"Laasya Goel", portfolio:"Alexander Albon" },
"FIA-021": { name:"Paras Jain", portfolio:"Nico Hülkenberg" },
"FIA-022": { name:"Sayed Arsalan Dehghanpour", portfolio:"Esteban Ocon" },
"FIA-023": { name:"Swarom Santosh Jadhav", portfolio:"Gabriel Bortoleto" },
"FIA-024": { name:"Seerat Khandelwal", portfolio:"Mattia Binnoto" },
"FIA-025": { name:"Praval Goyal", portfolio:"Valtteri Bottas" },	
};

let currentDelegate=null;

function checkID(){
    const id=document.getElementById("fiaInput").value.trim().toUpperCase();
    if(delegates[id]){
        currentDelegate=delegates[id];
        document.getElementById("gate").style.display="none";
        document.getElementById("startBtn").style.display="block";
    } else alert("Invalid FIA ID");
}

setInterval(()=>{
    document.getElementById("clock").innerHTML=new Date().toLocaleTimeString();
},1000);

function startShow(btn){
    document.getElementById("startSound").play();
    btn.style.display="none";
    document.getElementById("ready").style.display="block";

    setTimeout(()=>{
        document.getElementById("ready").style.display="none";
        document.getElementById("lights").style.display="block";

        let ids=["l1","l2","l3","l4"];
        let i=0;
        let interval=setInterval(()=>{
            let el=document.getElementById(ids[i]);
            el.style.background="red";
            el.style.boxShadow="0 0 40px red";
            i++;
            if(i===4){
                clearInterval(interval);
                setTimeout(()=>{
                    document.getElementById("lights").style.display="none";
                    document.getElementById("name").textContent=currentDelegate.name;
                    document.getElementById("port").textContent=currentDelegate.portfolio;
                    document.getElementById("result").style.display="block";
                },800);
            }
        },700);
    },2000);
}

setTimeout(()=>{
    document.addEventListener("click",function enterFullscreen(){
        if(!document.fullscreenElement){
            document.documentElement.requestFullscreen();
        }
        document.removeEventListener("click",enterFullscreen);
    });
},1000);
</script>
</body>
</html>
